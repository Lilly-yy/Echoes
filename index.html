<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Echoes is a calm, minimal space to share short thoughts, photos, and moments from nature." />
  <meta name="theme-color" content="#3D7D75" />
  <title>Echoes – Welcome</title>

  <link rel="stylesheet" href="./styles/output.css" />
  <link rel="icon" type="image/png" href="./resources/favicon.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Poppins&display=swap" rel="stylesheet" />

  <script type="module">
    import { getAuth } from "./scripts/apiClient.js";
    const { token, apiKey } = getAuth();

    window.addEventListener("DOMContentLoaded", () => {
      const authed = Boolean(token && apiKey);
      const guest = document.getElementById("cta-guest");
      const user  = document.getElementById("cta-user");
      guest?.classList.toggle("hidden", authed);
      user?.classList.toggle("hidden", !authed);
    });
  </script>
</head>
<body class="min-h-screen flex flex-col bg-gray-50">
  <header class="p-6">
    <a href="./index.html" aria-label="Echoes home">
      <img src="./resources/Echoes-logo-nobg.png" alt="Echoes logo" class="h-16" />
    </a>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center gap-6 text-center p-6">
    <h1 class="text-3xl font-bold">Welcome to Echoes</h1>
    <p class="text-gray-600 max-w-prose">
      A calm, minimal space to share short thoughts, photos, and moments from nature.
    </p>

    <!-- Guest CTAs -->
    <div id="cta-guest" class="flex gap-3">
      <a href="./login.html" class="px-4 py-2 rounded bg-[#3D7D75] text-white hover:bg-[#33665f]">Log in</a>
      <a href="./register.html" class="px-4 py-2 rounded border border-[#3D7D75] text-[#3D7D75] hover:bg-[#e6f2f1]">Register</a>
    </div>

    <!-- User CTAs -->
    <div id="cta-user" class="flex gap-3 hidden">
      <a href="./feed/index.html" class="px-4 py-2 rounded bg-[#3D7D75] text-white hover:bg-[#33665f]">Go to Feed</a>
      <a href="./profile/index.html" class="px-4 py-2 rounded border border-[#3D7D75] text-[#3D7D75] hover:bg-[#e6f2f1]">Profile</a>
    </div>

    <noscript>
      <div class="mt-4 p-3 rounded bg-yellow-100 text-yellow-800 text-sm">
        JavaScript is required to show the correct actions here.
      </div>
    </noscript>
  </main>

  <footer class="mt-auto">
    <div class="overflow-hidden w-full">
      <svg viewBox="0 0 1440 320" class="w-full h-20 scale-y-[-1]" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <path
          fill="#3D7D75" fill-opacity="1"
          d="M0,224L48,202.7C96,181,192,139,288,117.3C384,96,480,96,576,117.3C672,139,768,181,864,192C960,203,1056,181,1152,181.3C1248,181,1344,203,1392,213.3L1440,224L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"
        ></path>
      </svg>
    </div>
    <div class="bg-[#3D7D75] text-white text-center py-4 text-sm">
      © 2025 Echoes. All rights reserved.
    </div>
  </footer>
</body>
</html>
