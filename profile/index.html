<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="View your Echoes profile – your posts and activity." />
    <title>Echoes – Profile</title>

    <link rel="stylesheet" href="../styles/output.css" />
    <link rel="icon" href="../resources/favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Poppins&display=swap" rel="stylesheet" />

    <!-- Route guard -->
    <script type="module">
      import { getAuth } from "../scripts/apiClient.js";
      const { token, apiKey } = getAuth();
      if (!(token && apiKey)) location.href = "../login.html"; // relativ
    </script>

    <!-- Modul med logikk -->
    <script type="module" src="../scripts/profile.js"></script>
  </head>

  <body class="flex flex-col min-h-screen text-gray-800 font-sans">
    <!-- Header -->
    <header class="flex items-center justify-between px-6 h-24 bg-[url('../resources/background.png')] bg-cover bg-center shadow-md relative z-10">
      <a href="../feed/index.html" class="flex items-center gap-2">
        <img src="../resources/Echoes-logo-nobg.png" alt="Echoes logo" class="h-24 md:h-28 w-auto" />
      </a>
      <a href="./index.html">
        <img
          id="avatarIcon"
          src="../resources/avatars/noavatar.png"
          alt="Profile"
          class="w-10 h-10 md:w-14 md:h-14 rounded-full border-2 border-brand hover:opacity-80 transition"
        />
      </a>
    </header>

    <!-- Top Wave -->
    <div class="w-full overflow-hidden -mt-1">
      <svg viewBox="0 0 1440 320" class="w-full h-20" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <path
          fill="#3D7D75" fill-opacity="1"
          d="M0,224L48,202.7C96,181,192,139,288,117.3C384,96,480,96,576,117.3C672,139,768,181,864,192C960,203,1056,181,1152,181.3C1248,181,1344,203,1392,213.3L1440,224L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"
        ></path>
      </svg>
    </div>

    <main class="flex-grow p-4 flex flex-col items-center">
      <!-- Profile Section -->
      <section class="w-full max-w-3xl bg-white p-6 rounded-xl shadow flex flex-col items-center text-center mb-8">
        <img
          id="currentAvatar"
          src="../resources/avatars/noavatar.png"
          alt="User avatar"
          class="w-24 h-24 rounded-full object-cover mb-4 border-2 border-brand cursor-pointer hover:opacity-80 transition"
        />
        <h1 id="username" class="text-2xl font-semibold">@user</h1>

      </section>

      <!-- Followers / Following -->
      <section class="w-full max-w-3xl text-center mb-8">
        <div class="flex justify-center gap-8 text-sm">
          <div>
            <span id="followersCount" class="block font-bold text-lg">0</span>
            Followers
          </div>
          <div>
            <span id="followingCount" class="block font-bold text-lg">0</span>
            Following
          </div>
        </div>
      </section>

      <!-- Create New Echo -->
      <section class="w-full max-w-3xl mb-8 bg-white p-6 rounded-xl shadow">
        <h2 class="text-xl font-semibold mb-4">Release an Echo</h2>
        <form id="createOnProfile" class="flex flex-col gap-4">
          <input name="title" type="text" placeholder="Title" required class="w-full px-4 py-2 border border-gray-300 rounded" />
          <textarea name="body" placeholder="What echo will you release today?" required class="w-full h-24 px-4 py-2 border border-gray-300 rounded resize-none"></textarea>
          <input name="imageUrl" type="url" placeholder="Image URL (optional, must be public)" class="w-full px-4 py-2 border border-gray-300 rounded" />
          <input name="tags" type="text" placeholder="Tags (comma separated, optional)" class="w-full px-4 py-2 border border-gray-300 rounded" />
          <div class="flex items-center justify-between">
            <p id="createMsg" class="text-sm"></p>
            <button type="submit" class="self-end bg-[#3D7D75] text-white px-4 py-2 rounded hover:bg-[#33665f]">
              Release</button>
          </div>
        </form>
      </section>

      <!-- Posts -->
      <section class="w-full max-w-3xl space-y-6 mb-8">
        <h2 class="text-xl font-semibold text-center mb-4">Your echoes</h2>
        <div id="userPosts" class="space-y-6" role="status" aria-live="polite">
          <p class="text-gray-500">Loading your posts…</p>
        </div>
      </section>

      <button
        id="logoutBtn"
        class="mt-2 px-4 py-2 text-[#3D7D75] border border-[#3D7D75] rounded hover:bg-[#3D7D75] hover:text-white transition text-sm"      >
        Logout
      </button>
    </main>

    <!-- Footer -->
    <footer class="mt-auto">
      <div class="overflow-hidden w-full">
        <svg viewBox="0 0 1440 320" class="w-full h-20 scale-y-[-1]" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <path
            fill="#3D7D75" fill-opacity="1"
            d="M0,224L48,202.7C96,181,192,139,288,117.3C384,96,480,96,576,117.3C672,139,768,181,864,192C960,203,1056,181,1152,181.3C1248,181,1344,203,1392,213.3L1440,224L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"
          ></path>
        </svg>
      </div>
      <div class="bg-brand text-white text-center py-4 text-sm">
        © 2025 Echoes. All rights reserved.
      </div>
    </footer>

    <!-- Avatar Selection Modal -->
    <div id="avatarModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
      <div class="bg-white p-6 rounded-xl shadow-lg relative max-w-md w-full">
        <button id="closeModal" class="absolute top-2 right-2 text-gray-600 hover:text-black text-xl" aria-label="Close">&times;</button>
        <h2 class="text-xl font-semibold mb-4 text-center">Choose Your Avatar</h2>
        <div id="avatarOptions" class="grid grid-cols-4 gap-4"></div>
      </div>
    </div>
  </body>
</html>
